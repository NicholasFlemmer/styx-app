name: Idea or request
description: Something Styx should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way today. The problem matters more than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tasks and agents
        - Access, targets and approvals
        - Design and Preview
        - Review, land and publish
        - A new agent CLI
        - A new deploy target
        - Docs
        - Something else
