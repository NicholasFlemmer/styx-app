name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Playwright browsers (Storybook axe + prototype baker)
        run: npx playwright install --with-deps chromium
      - run: pnpm -F @styx/ui storybook:test
      - name: Electron e2e (main window, shell, grant flow, a11y)
        if: runner.os == 'macOS'
        run: pnpm e2e
      - name: Electron e2e on Windows (main window, shell, grant flow, a11y)
        if: runner.os == 'Windows'
        run: pnpm e2e
      - name: Packaged app smoke (unsigned)
        if: runner.os == 'macOS'
        run: pnpm -F @styx/desktop package:mac:dir && pnpm -F @styx/desktop package:smoke
      - name: Packaged app smoke on Windows (unsigned)
        if: runner.os == 'Windows'
        run: pnpm -F @styx/desktop package:win:dir && pnpm -F @styx/desktop package:smoke
