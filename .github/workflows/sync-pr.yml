name: sync-pr
# Changes from the maintainers' working repo arrive on the `sync` branch (pushed by its mirror job, one commit per
# sync on top of main). This opens, or updates, the pull request for it and turns on auto-merge, so it lands on main
# by itself once CI passes on Mac, Windows and Linux. Rebase merge keeps the commit and its author as they are.
on:
  push:
    branches: [sync]
  # GitHub doesn't close "Fixes #N" issues when its own Actions bot does the merge (auto-merge here), so a sweep
  # closes the ones a merged sync pull request names.
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, issues: write }
concurrency: { group: sync-pr, cancel-in-progress: false }
jobs:
  pr:
    if: github.repository == 'NicholasFlemmer/styx-app' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: sync, fetch-depth: 2 }
      - name: Open or update the pull request, then auto-merge it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(git log -1 --format=%s | cut -c1-200)
          {
            git log -1 --format=%b
            # Titles name their issues as "(#29)"; GitHub only closes an issue on merge for a keyword, so list them.
            git log -1 --format=%B | grep -oE '\(#[0-9]+(, #[0-9]+)*\)' | grep -oE '#[0-9]+' | sort -u | sed 's/^/Fixes /'
            echo
            echo "---"
            echo "Synced from the maintainers' working repo. It merges itself once CI passes on Mac, Windows and Linux."
          } > "$RUNNER_TEMP/body.md"
          # GitHub's API has transient errors; each call gets three tries.
          retry() { for i in 1 2 3; do "$@" && return 0; sleep $((i * 10)); done; return 1; }
          pr=$(gh pr list --head sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            retry gh pr create --head sync --base main --title "$title" --body-file "$RUNNER_TEMP/body.md"
            pr=$(gh pr list --head sync --base main --state open --json number --jq '.[0].number')
          else
            retry gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          retry gh pr merge "$pr" --auto --rebase
          echo "Pull request #$pr will merge once CI passes." >> "$GITHUB_STEP_SUMMARY"
  close-fixed:
    if: github.repository == 'NicholasFlemmer/styx-app' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close issues that merged sync pull requests fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $pr belongs to jq, not the shell
          gh pr list -R "$REPO" --head sync --state merged --limit 20 \
            --json number,closingIssuesReferences --jq '.[] | .number as $pr | .closingIssuesReferences[] | "\($pr) \(.number)"' |
          while read -r pr issue; do
            if [ "$(gh issue view "$issue" -R "$REPO" --json state --jq .state)" = OPEN ]; then
              gh issue close "$issue" -R "$REPO" -r completed -c "Fixed in #$pr."
              echo "Closed #$issue (fixed in #$pr)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
