appId: dev.styx.app
productName: Styx
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - "**/*.node"
  - "node_modules/node-pty/**"
  - "resources/**"
# Updates in place (#119): with a publish feed configured, electron-builder writes `app-update.yml` into the app and
# `latest-mac.yml` / `latest.yml` next to the artefacts. A build never uploads anything itself (`--publish never` is the
# default outside CI); `pnpm release:publish` puts a finished build on the feed. `${os}` is `mac` or `win`.
publish:
  - provider: generic
    url: https://storage.googleapis.com/styx-desktop-releases/${os}
# Notarization runs in the afterSign hook (build/notarize.cjs) with the `styx-notary` keychain profile, so no
# Apple password is ever an env var. electron-builder's own integration is off to avoid a second submission.
afterSign: build/notarize.cjs
# The .dmg is signed with the same Developer ID and notarized too (build/notarize-dmg.cjs), not only the app in it.
afterAllArtifactBuild: build/notarize-dmg.cjs
dmg:
  sign: true
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
# The Microsoft Store package (`pnpm package:win:store`, Windows only). Microsoft signs it on submission, so Windows
# shows no unknown-publisher warning and the Store delivers updates (the in-app updater is off in a Store build).
# Identity values are Partner Center's Product identity for the reserved name; displayName must equal that name.
# Tiles are in build/appx/.
appx:
  identityName: HeyStyx.HeyStyx
  publisher: CN=03B88DAC-F4A5-4B15-A423-61DAEF99F34D
  publisherDisplayName: Hey Styx
  applicationId: Styx
  displayName: Hey Styx
  backgroundColor: "#0d0e0c"
  languages: [en-US]
protocols:
  - name: Styx
    schemes: [styx]
