# Cloud Run terminates TLS in front of this, so nginx only ever sees plain HTTP on 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  # One canonical host: www and the Cloud Run URL both send people to heystyx.com.
  if ($host = www.heystyx.com) { return 301 https://heystyx.com$request_uri; }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
  gzip_min_length 1024;

  include /etc/nginx/security-headers.conf;

  # Hashed build assets never change: cache them for a year.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # The share-card image has no extension; without this, previews on X and LinkedIn break.
  location = /opengraph-image {
    default_type image/png;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/security-headers.conf;
    try_files /opengraph-image =404;
  }

  # The Download button (discrepancy #122): the API counts it by source, with nothing about the person, then
  # redirects to the newest DMG. The browser keeps the original Referer across both hops, so a click from
  # news.ycombinator.com is counted as that. `?from=hn` on a launch link wins over the referrer.
  location = /download/mac {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
    return 302 https://styx-api-994871833762.us-central1.run.app/download/mac$is_args$args;
  }

  # The short form for posts and bios.
  location = /download {
    add_header Cache-Control "no-store";
    include /etc/nginx/security-headers.conf;
    return 302 /download/mac$is_args$args;
  }

  # Pages: short cache so a redeploy shows up within minutes.
  location / {
    add_header Cache-Control "public, max-age=300";
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
